<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H4 ERP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--hd:#1b0b4d;--gold:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#151b2e;--ink:#e8ecf5;--mut:#94a3b8;--line:#263049}}
:root[data-theme=dark]{--bg:#0b1020;--card:#151b2e;--ink:#e8ecf5;--mut:#94a3b8;--line:#263049}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px}
header b{font-size:19px;flex:1}header .st{color:var(--gold);font-size:22px}
.hb{border:1px solid #ffffff55;background:none;color:#fff;border-radius:12px;padding:8px 11px;font:600 13px inherit;font-family:inherit}
.hb.g{background:var(--gold);color:#1b0b4d;border:0}
main{padding:14px;max-width:760px;margin:auto}
h2{font-size:12px;letter-spacing:.08em;color:var(--mut);margin:18px 4px 8px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:22px;padding:14px;color:#fff;text-align:left;min-height:104px;position:relative;font-family:inherit;box-shadow:0 8px 18px #0002}
.tile i{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;background:#ffffff35;border-radius:99px;padding:3px 10px}
.tile .ic{font-size:26px;display:block;margin-bottom:10px}.tile b{display:block;font-size:17px}.tile small{opacity:.9;font-size:12px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 2px 10px #0000000c}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.li small,.mut{color:var(--mut)}.li b{display:block}.r{text-align:right}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;color:#fff;background:#64748b}
.ok{background:#059669}.warn{background:#d97706}.bad{background:#e11d48}.blue{background:#2563eb}
.btn.s{background:#475569}.btn.d{background:#e11d48}.btn.g{background:#059669}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1}
.sum{background:linear-gradient(135deg,#059669,#34d399);color:#fff;border-radius:18px;padding:14px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}.sum .big{font-size:20px;font-weight:800}
.bar{height:10px;border-radius:6px;background:#4f46e5;margin-top:4px}
.row6{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 28px;gap:6px;margin-top:6px}
.row6 input,.row6 select{padding:8px 6px;font-size:13px}
.srch{margin-top:10px}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.on{opacity:1}
.pg{position:relative;background:#fff;margin:0 auto 10px;box-shadow:0 2px 12px #0003;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#0f172a}.pg.grid{background-image:linear-gradient(#0000 4.7mm,#e2e8f0 4.7mm),linear-gradient(90deg,#0000 4.7mm,#e2e8f0 4.7mm);background-size:5mm 5mm}
.el{position:absolute;white-space:pre-line;overflow:hidden;padding:.5mm;line-height:1.25}.el.sel{outline:.6mm solid #4f46e5}#edc .el{touch-action:none;cursor:move}.pn{position:absolute;bottom:4mm;right:8mm;font-size:7pt;color:#64748b}.pr{display:none}@media print{.pr{display:block;margin-bottom:8px;font-size:12px}}.rh{position:absolute;right:0;bottom:0;width:4mm;height:4mm;background:#4f46e5;opacity:.85;touch-action:none;cursor:nwse-resize}.rw .pg{margin:0}.sm{padding:8px 10px!important;flex:none!important}
@media print{header,.noprint,.toast{display:none!important}body{background:#fff;padding:0}main{padding:0;max-width:none}#pv{zoom:1!important}.pg{margin:0;box-shadow:none;page-break-after:always}}
.lkw{min-height:calc(100dvh - 130px);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,5vh) 0 24px}
.lk{width:100%;max-width:360px;margin:0 auto;padding:24px 20px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;border-radius:20px}
.lki{font-size:36px;line-height:1;margin:0 auto}.lk h3{margin:0;font-size:20px}
.lke{min-height:20px;margin:0;font-size:13px;line-height:1.35;color:#dc2626}
.lk input{height:50px;font-size:18px;margin:0}.lk input#lp[inputmode]{text-align:center;letter-spacing:.3em}
.lkb{height:48px;width:100%;font-size:15px}.lkb[disabled]{opacity:.6}
.lk input:focus-visible,.lkb:focus-visible{outline:3px solid #4f46e5;outline-offset:2px}
.lkn{margin:0;font-size:12px;line-height:1.4;color:var(--mut)}
@media(max-height:480px){.lkw{padding-top:6px}.lk{padding:12px 16px;gap:8px}.lki{font-size:24px}.lk input,.lkb{height:42px}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head><body>
<header><span class="st">✦</span><b id="ht" onclick="go('home')" style="cursor:pointer">H4 ERP</b><button class="hb" onclick="go('home');setTimeout(()=>{const x=$('gsi');x&&x.focus()},60)">🔍</button><button class="hb" id="hn" onclick="go('notif')">🔔</button><button class="hb g" onclick="quickQuote()">+ Quote</button></header>
<main id="app"></main><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),fmt=v=>'₹'+(+v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\.00$/,'');
const ST={Kerala:'32','Tamil Nadu':'33',Karnataka:'29',Maharashtra:'27','Andhra Pradesh':'37',Telangana:'36',Gujarat:'24','Delhi':'07'},UN=['kg','g','tonne','L','ml','pcs','bag','barrel','drum','box','hour','batch','sq.ft','sq.m','nos'];
Object.assign(ST,{'Andhra Pradesh':'37','Arunachal Pradesh':'12',Assam:'18',Bihar:'10',Chhattisgarh:'22',Goa:'30',Haryana:'06','Himachal Pradesh':'02','Jammu & Kashmir':'01',Jharkhand:'20','Madhya Pradesh':'23',Manipur:'14',Meghalaya:'17',Mizoram:'15',Nagaland:'13',Odisha:'21',Punjab:'03',Rajasthan:'08',Sikkim:'11',Tripura:'16','Uttar Pradesh':'09',Uttarakhand:'05','West Bengal':'19',Puducherry:'34',Chandigarh:'04',Ladakh:'38','Andaman & Nicobar':'35',Lakshadweep:'31','Dadra & Nagar Haveli and Daman & Diu':'26'});let D={company:{},customers:[],suppliers:[],rms:[],products:[],payments:[],expenses:[],costs:[],formulas:[],batches:[],invoices:[],seq:{}};
let SAVEERR=0,LOADERR=0;
try{const s=localStorage.getItem('h4erp');if(s){const o=JSON.parse(s);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;D=Object.assign(D,o)}}catch(e){LOADERR=1;try{const raw=localStorage.getItem('h4erp');if(raw&&!localStorage.getItem('h4erp_corrupt'))localStorage.setItem('h4erp_corrupt',raw)}catch(x){}}
const save=()=>{if(LOADERR)return;try{localStorage.setItem('h4erp',JSON.stringify(D));if(SAVEERR){SAVEERR=0;banner('')}}catch(e){if(!SAVEERR){SAVEERR=1;banner('⚠ Browser storage is full — your latest changes are NOT being saved. Open Backup, take a backup now, then remove large images or old records.','Open Backup',"go('bk')")}}};
const SEQC={CUS:'customers',PRD:'products',SUP:'suppliers',RM:'rms',EXP:'expenses',PAY:'payments',COST:'costs',FM:'formulas',BATCH:'batches',INV:'invoices',PUR:'purchases',QT:'quotes'};
const nxt=(p,k)=>{let mx=D.seq[k]||0;(D[SEQC[p]]||[]).forEach(x=>{const m=String((x&&x.id)||'').match(new RegExp('^'+p+'-(\\d+)'));if(m)mx=Math.max(mx,+m[1])});D.seq[k]=mx+1;return p+'-'+String(mx+1).padStart(4,'0')};
const today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
const go=r=>{const p=r.split('/');if(p[p.length-1]==='new'&&!can(RMAP[p[0]],'add')){toast('No permission to add');return}location.hash='/'+r},back=()=>history.length>1?history.back():go('home');
// ---------- generic simple modules ----------
const O=a=>a.map(x=>[x,x]);
const M={
cus:{t:'Customers',k:'customers',p:'CUS',f:[['name','Customer name *'],['mobile','Mobile *','tel'],['email','Email'],['state','State','sel',Object.keys(ST)],['gstin','GSTIN'],['address','Address','ta']],ti:'name',su:r=>r.mobile+' · '+(r.state||'')},
sup:{t:'Suppliers',k:'suppliers',p:'SUP',f:[['name','Supplier name *'],['contact','Contact person'],['mobile','Mobile','tel'],['email','Email'],['location','Location / place'],['district','District'],['state','State','sel',Object.keys(ST)],['gstreg','GST registered','sel',['Yes','No']],['gstin','GSTIN'],['bank','Bank name'],['benef','Beneficiary / account holder'],['acct','Bank account number'],['ifsc','IFSC code'],['branch','Branch'],['upi','UPI ID']],ti:'name',su:r=>r.location||r.mobile},
rm:{t:'Raw Materials',k:'rms',p:'RM',f:[['name','Material name *'],['unit','Unit','sel',UN]],ti:'name',su:r=>r.unit+' · '+(curCost(r.name)?fmt(curCost(r.name).cpu)+'/'+r.unit:'no approved cost')+stkTxt(r)},
prd:{t:'Products',k:'products',p:'PRD',f:[['name','Product name *'],['unit','Unit','sel',UN],['rate','Selling rate (₹)','num']],ti:'name',su:r=>fmt(r.rate)+'/'+r.unit},
exp:{t:'Expenses',k:'expenses',p:'EXP',f:[['date','Date','date'],['name','Category *  (Power, Rent, Wages…)'],['amount','Amount *','num'],['notes','Notes']],ti:'name',su:r=>r.date,am:r=>fmt(r.amount)},
pay:{t:'Payments',k:'payments',p:'PAY',f:[['dir','Direction','sel',['Received','Paid']],['date','Date','date'],['name','Name *'],['item','Purchase / Item name'],['acct','Account No. (optional)'],['party','Party','sel',['Customer','Supplier','Other']],['mode','Mode','sel',['UPI','Bank','Cash','Cheque','Card','Other']],['amount','Amount *','num'],['ref','Reference No.'],['against','Against','sel',['None','Invoice','Purchase','Advance']],['link','Invoice / Purchase no. (if against)'],['notes','Notes']],ti:'name',su:r=>r.dir+' · '+r.mode+' · '+r.date+(r.link?' · '+r.link:'')+(r.acct?' · ••••'+String(r.acct).slice(-4):''),am:r=>(r.dir==='Received'?'+':'−')+fmt(r.amount),cancel:1}
};
function curCost(n){return D.costs.find(c=>c.rm===n&&c.status==='Approved')}
function fld(f,v){const[k,l,t,o]=f,id='f_'+k;v=v??'';
 if(t==='sel')return `<label>${l}</label><select id="${id}">${(o).map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
 if(t==='ta')return `<label>${l}</label><textarea id="${id}" rows="2">${esc(v)}</textarea>`;
 return `<label>${l}</label><input id="${id}" type="${t==='num'?'number':t||'text'}" ${t==='num'?'step="any" inputmode="decimal"':''} value="${esc(v)}">`}
function list(m,q=''){const c=M[m],a=[...D[c.k]].reverse().filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
 return `<h2>${c.t.toUpperCase()}</h2>`+(m==='pay'?paySum()+`<div class="acts" style="margin:8px 0 0"><button class="btn s sm" onclick="go('exp')">💸 Expenses (power, rent, wages)</button></div>`:'')+`<input class="srch" placeholder="🔍 Search" value="${esc(q)}" oninput="$('lst').innerHTML=rows('${m}',this.value)"><div id="lst">${rows(m,q)}</div>
 <div class="acts"><button class="btn s" onclick="back()">← Back</button><button class="btn" onclick="go('${m}/new')">＋ Add</button></div>`}
function rows(m,q){const c=M[m],a=[...D[c.k]].reverse().filter(r=>(m!=='pay'||!PT||r.dir===PT)&&JSON.stringify(r).toLowerCase().includes((q||'').toLowerCase()));
 return a.map(r=>`<div class="card li" onclick="go('${m}/${r.id}')"><div><b>${esc(r[c.ti])}</b><small>${esc(r.id)} · ${esc(c.su(r))}</small></div><div class="r">${c.am?`<b>${c.am(r)}</b>`:''}${r.status==='Cancelled'?'<span class="chip bad">Cancelled</span>':r.archived?'<span class="chip">Archived</span>':''}</div></div>`).join('')||empty(m+'/new')}
function form(m,id){const c=M[m],r=c.single?D.company:(D[c.k].find(x=>x.id===id)||{date:today(),...(m==='pay'&&PRE?(()=>{const x=PRE;PRE=null;return x})():{})});
 return `<h2>${c.t.toUpperCase()}</h2><div class="card">${(()=>{const L=m==='pay'&&r.id,fl=f=>fld(f,r[f[0]]??(f[0]==='date'?today():''));return L?`<p class="mut" style="font-size:12px;margin:0">🔒 A saved payment cannot be changed. If something is wrong, cancel it with a reason and enter a new payment. Only the note can be edited.</p><fieldset disabled style="border:0;padding:0;margin:0">${c.f.filter(f=>f[0]!=='notes').map(fl).join('')}</fieldset>${fl(c.f.find(f=>f[0]==='notes'))}`:c.f.map(fl).join('')})()}<div class="acts"><button class="btn s" onclick="back()">← Back</button><button class="btn g" onclick="sv('${m}','${id||''}')">💾 Save</button>${m==='pay'&&r.id?`<button class="btn s" onclick="go('rdoc/${r.id}')">🧾 Receipt</button>`:''}
 ${r.id&&!c.single?(c.cancel?(r.status==='Cancelled'?'':`<button class="btn d" onclick="cn('${m}','${r.id}')">Cancel entry</button>`):`<button class="btn d" onclick="ar('${m}','${r.id}')">Archive</button>`):''}</div></div>
 `}
function sv(m,id){if(m==='pay'&&id){const rc=D.payments.find(x=>x.id===id);if(rc){if(rc.status==='Cancelled')return toast('A cancelled payment cannot be changed');const nt=($('f_notes')||{value:''}).value.trim();if(nt!==(rc.notes||'')){(rc.hist=rc.hist||[]).push({at:new Date().toLocaleString(),u:(typeof CU!=='undefined'&&CU&&CU.name)||'System',was:{notes:rc.notes||''}});rc.notes=nt;saud('Payment note edited',id)}save();toast('Note saved');QD=0;back();return}}const c=M[m],o={};for(const f of c.f)o[f[0]]=$('f_'+f[0]).value.trim();
 const req=c.f.find(f=>f[1].includes('*')&&!o[f[0]]);if(req)return toast('Fill: '+req[1].replace('*',''));for(const f of c.f)if(f[2]==='num'&&o[f[0]]!=='')o[f[0]]=+o[f[0]]||0;
 if(o.amount!==undefined&&!(+o.amount>0))return toast('Enter valid amount');
 if(m==='sup'){if(o.ifsc){o.ifsc=o.ifsc.toUpperCase().replace(/\s/g,'');if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(o.ifsc))return toast('IFSC code format is invalid')}if(o.acct&&!/^\d{6,20}$/.test(o.acct.replace(/\s/g,'')))return toast('Account number must be 6–20 digits');if(o.upi&&!/^[\w.\-]{2,}@[A-Za-z]{2,}$/.test(o.upi))return toast('UPI ID format is invalid')}
 if(o.gstin&&o.state&&o.gstin.slice(0,2)!==ST[o.state])return toast('GSTIN must start with '+ST[o.state]);
 if(m==='pay'){if(['Invoice','Purchase'].includes(o.against)){const inv=o.against==='Invoice',doc=(inv?D.invoices:D.purchases).find(v=>v.id===(o.link||'').toUpperCase());if(!doc||['Draft','Cancelled'].includes(doc.status))return toast(o.against+' number not found or not confirmed');let bal=inv?invS(doc).bal:purT(doc).gt-purPaid(doc);const ex=id?D.payments.find(x=>x.id===id):null;if(ex&&ex.link===doc.id&&ex.status!=='Cancelled')bal+=ex.amount;if(+o.amount>bal+.5&&!confirm('Amount is more than the balance '+fmt(bal)+'. Save anyway?'))return;o.link=doc.id;if(!o.item)o.item=doc.id}else o.link=''}
 if(c.single){Object.assign(D.company,o);o.state&&(D.company.stateCode=ST[o.state])}
 else if(id){const rc=D[c.k].find(x=>x.id===id);if(m==='pay'){(rc.hist=rc.hist||[]).push({at:new Date().toLocaleString(),u:(typeof CU!=='undefined'&&CU&&CU.name)||'System',was:{date:rc.date,name:rc.name,amount:rc.amount,mode:rc.mode,link:rc.link||''}})}Object.assign(rc,o)}else{const nr=Object.assign({id:nxt(c.p,m),status:'Active'},o);if(m==='pay'){nr.cs={...D.company};nr.tpl=cl(curTpl('receipt'))}D[c.k].push(nr);if(m==='sup'&&SRET&&PV){PV.sup=nr.name}}
 save();toast('Saved');QD=0;c.single?render():back()}
function ar(m,id){if(!confirm('Archive this record? History is kept.'))return;D[M[m].k].find(x=>x.id===id).archived=1;save();back()}
function cn(m,id){const r=prompt('Cancel reason (e.g. Wrong amount, Duplicate):');if(!r)return;const x=D[M[m].k].find(x=>x.id===id);x.status='Cancelled';x.reason=r;save();back()}
// ---------- Purchases = Raw Material Landed Cost ----------
function costView(id){const c=D.costs.find(x=>x.id===id)||{date:today(),status:'Draft',charges:0};
 const opt=a=>a.map(x=>`<option ${x==c[a._k]?'selected':''}>${esc(x.name||x)}</option>`).join('');
 return `<h2>PURCHASE · LANDED COST</h2><div class="card">
 <label>Raw material</label><select id="c_rm">${D.rms.map(x=>`<option ${x.name==c.rm?'selected':''}>${esc(x.name)}</option>`).join('')||'<option value="">Add raw material first</option>'}</select>
 <label>Supplier</label><select id="c_sup"><option value="">—</option>${D.suppliers.map(x=>`<option ${x.name==c.sup?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <div class="two"><div><label>Quantity</label><input id="c_q" type="number" step="any" value="${c.q||''}" oninput="cc()"></div><div><label>Unit</label><select id="c_u">${UN.map(u=>`<option ${u==c.u?'selected':''}>${u}</option>`).join('')}</select></div></div>
 <div class="two"><div><label>Purchase rate</label><input id="c_r" type="number" step="any" value="${c.r||''}" oninput="cc()"></div><div><label>Freight</label><input id="c_f" type="number" step="any" value="${c.f||''}" oninput="cc()"></div></div>
 <div class="two"><div><label>Other charges</label><input id="c_o" type="number" step="any" value="${c.o||''}" oninput="cc()"></div><div><label>Date</label><input id="c_d" type="date" value="${c.date}"></div></div></div>
 <div class="sum" id="c_sum"></div>
 <div class="acts"><button class="btn s" onclick="back()">← Back</button>${c.status==='Approved'?'':`<button class="btn" onclick="cs('${id||''}','Draft')">Save draft</button><button class="btn g" onclick="cs('${id||''}','Approved')">Approve</button>`}</div>`}
function cv(){const q=+$('c_q').value||0,r=+$('c_r').value||0,f=+$('c_f').value||0,o=+$('c_o').value||0,m=q*r,l=m+f+o;return{m,l,cpu:q?l/q:0}}
function cc(){const v=cv();$('c_sum').innerHTML=`<div><span>Material cost</span><b>${fmt(v.m)}</b></div><div><span>Freight + other</span><b>${fmt(l2())}</b></div><div class="big"><span>Landed cost</span><span>${fmt(v.l)}</span></div><div><span>Cost / ${$('c_u').value}</span><b>${fmt(v.cpu)}</b></div>`}
const l2=()=>(+$('c_f').value||0)+(+$('c_o').value||0);
function cs(id,status){const v=cv(),o={rm:$('c_rm').value,sup:$('c_sup').value,q:+$('c_q').value,u:$('c_u').value,r:+$('c_r').value,f:+$('c_f').value||0,o:+$('c_o').value||0,date:$('c_d').value,status,...v};
 if(!o.rm||!(o.q>0)||!(o.r>0))return toast('Material, quantity and rate are required');
 if(status==='Approved')D.costs.filter(c=>c.rm===o.rm&&c.status==='Approved').forEach(c=>c.status='Archived');
 const e=D.costs.find(x=>x.id===id);e?Object.assign(e,o):D.costs.push({id:nxt('COST','cost'),...o});save();toast(status);QD=0;back()}

function fiR(){$('fi').innerHTML=FI.map((i,k)=>{const raw=i.t==='raw',ap=raw?curCost(i.n):null;return `<div class="row6"><select onchange="FI[${k}].t=this.value;fiR()">${[['raw','Raw'],['pack','Pack'],['lab','Labour'],['elec','Elec'],['oth','Other']].map(([v,l])=>`<option value="${v}" ${v==i.t?'selected':''}>${l}</option>`).join('')}</select>
 <input placeholder="${raw?'Raw material':'Name'}" ${raw?'list="rml"':''} value="${esc(i.n)}" onchange="FI[${k}].n=this.value;fiR()"><input type="number" step="any" placeholder="Qty" value="${i.q}" oninput="FI[${k}].q=+this.value;ftt()">
 <select onchange="FI[${k}].u=this.value">${[...new Set([...UN,i.u])].map(u=>`<option ${u==i.u?'selected':''}>${u}</option>`).join('')}</select><button class="hb" style="color:#e11d48;border-color:#e11d48" onclick="FI.splice(${k},1);fiR()">✕</button>
 <input type="number" step="any" style="grid-column:2/5" placeholder="${raw?(ap?'':'⚠ no approved landed cost'):'Rate ₹'}" value="${raw?(ap?+ap.cpu.toFixed(2):''):(i.r||'')}" ${raw?'readonly':''} oninput="FI[${k}].r=+this.value;ftt()"><span class="mut r" style="grid-column:5">${fmt(i.q*rate(i))}</span></div>`}).join('')+`<datalist id="rml">${D.rms.map(r=>`<option>${esc(r.name)}</option>`).join('')}</datalist>`;ftt()}
function fs(id){const pid=($('fp')||{}).value||'',pr=D.products.find(p=>p.id===pid),o={name:($('fn').value||'').trim(),bq:+$('fq').value,bu:$('fu').value,items:FI.filter(i=>i.n).map(({t,n,q,u,r})=>({t,n,q,u,r:t==='raw'?0:(+r||0)}))};const e=D.formulas.find(x=>x.id===id);
 if(!pid&&!e)return toast('Select a product');if(!(o.bq>0)||!o.items.length)return toast('Base quantity and items are required');if(!o.name)o.name=(pr?pr.name:(e&&e.name)||'Formula')+' mixing formula';
 const bad=o.items.filter(i=>i.t==='raw'&&!D.rms.some(r=>r.name===i.n)).map(i=>i.n);if(bad.length)return toast('Not in raw material master: '+bad.join(', '));
 if(e){if(e.test){const s=$('tstat').value;if(s==='Approved'&&e.tstatus!=='Approved'&&!can('prod','approve'))return toast('No permission: approve');if(s!==e.tstatus)paud('Test formula '+s.toLowerCase(),e.ver);e.tstatus=s;Object.assign(e,{bq:o.bq,bu:o.bu,items:o.items,name:o.name})}
  else{const same=JSON.stringify([e.name,e.bq,e.bu,e.items.map(({t,n,q,u,r})=>({t,n,q,u,r:t==='raw'?0:r}))])===JSON.stringify([o.name,o.bq,o.bu,o.items]);if(!same){if(fst(e)==='Confirmed'){(e.hist=e.hist||[]).push({ver:e.ver,at:today(),bq:e.bq,bu:e.bu,name:e.name,items:cl(e.items)});e.ver=vnext(e.ver);paud('Formula new version',pname(e)+' · '+o.name+' '+e.ver)}else paud('Formula edited',o.name);Object.assign(e,o)}}}
 else{D.formulas.push({id:nxt('FM','fm'),pid,ver:'V1',status:'Draft',hist:[],...o});paud('Formula created',(pr?pr.name:'')+' · '+o.name)}FI=[];FPID='';QD=0;save();toast('Formula saved');back()}
function fcf(id){const f=D.formulas.find(x=>x.id===id),miss=f.items.filter(i=>i.t==='raw'&&!curCost(i.n)).map(i=>i.n);if(miss.length)return toast('No approved landed cost for: '+miss.join(', '));f.status='Confirmed';paud('Formula confirmed',pname(f)+' · '+f.name+' '+f.ver);FI=[];save();toast('Confirmed – active for production');render()}
function ntf(id){const b=D.formulas.find(x=>x.id===id),n=D.formulas.filter(x=>x.test).length+1,t={id:nxt('FM','fm'),pid:b.pid,name:b.name,ver:'TEST-'+String(n).padStart(3,'0'),bq:b.bq,bu:b.bu,items:cl(b.items),status:'Draft',test:1,tstatus:'Draft',base:b.id};D.formulas.push(t);paud('Test formula created',t.ver+' from '+b.ver);FI=[];save();go('fm/'+t.id)}
function prodHome(){const t=today(),mo=t.slice(0,7),B=D.batches.filter(b=>b.status==='Completed'),sum=a=>a.reduce((x,b)=>x+(+b.out||0),0),M=B.filter(b=>b.date.slice(0,7)===mo),avg=(a,k)=>a.length?a.reduce((x,b)=>x+(b[k]||0),0)/a.length:0;
 return `<h2>PRODUCTION</h2><div class="grid">${[["Today's production",sum(B.filter(b=>b.date===t))],['This month',sum(M)],['Active batches',D.batches.filter(b=>b.status==='In Production').length],['Avg cost / unit',fmt(avg(M,'cpu'))],['Avg yield',avg(M,'yield').toFixed(1)+'%']].map(([a,v])=>`<div class="card" style="margin:0"><small class="mut">${a}</small><br><b style="font-size:17px">${v}</b></div>`).join('')}</div>
