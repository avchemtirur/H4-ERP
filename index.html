<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H4 ERP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--hd:#1b0b4d;--gold:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#151b2e;--ink:#e8ecf5;--mut:#94a3b8;--line:#263049}}
:root[data-theme=dark]{--bg:#0b1020;--card:#151b2e;--ink:#e8ecf5;--mut:#94a3b8;--line:#263049}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px}
header b{font-size:19px;flex:1}header .st{color:var(--gold);font-size:22px}
.hb{border:1px solid #ffffff55;background:none;color:#fff;border-radius:12px;padding:8px 11px;font:600 13px inherit;font-family:inherit}
.hb.g{background:var(--gold);color:#1b0b4d;border:0}
main{padding:14px;max-width:760px;margin:auto}
h2{font-size:12px;letter-spacing:.08em;color:var(--mut);margin:18px 4px 8px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:22px;padding:14px;color:#fff;text-align:left;min-height:104px;position:relative;font-family:inherit;box-shadow:0 8px 18px #0002}
.tile i{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;background:#ffffff35;border-radius:99px;padding:3px 10px}
.tile .ic{font-size:26px;display:block;margin-bottom:10px}.tile b{display:block;font-size:17px}.tile small{opacity:.9;font-size:12px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 2px 10px #0000000c}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.li small,.mut{color:var(--mut)}.li b{display:block}.r{text-align:right}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;color:#fff;background:#64748b}
.ok{background:#059669}.warn{background:#d97706}.bad{background:#e11d48}.blue{background:#2563eb}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 16px;font:700 14px inherit;font-family:inherit;color:#fff;background:#4f46e5}
.btn.s{background:#475569}.btn.d{background:#e11d48}.btn.g{background:#059669}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1}
.sum{background:linear-gradient(135deg,#059669,#34d399);color:#fff;border-radius:18px;padding:14px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}.sum .big{font-size:20px;font-weight:800}
.bar{height:10px;border-radius:6px;background:#4f46e5;margin-top:4px}
.row6{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 28px;gap:6px;margin-top:6px}
.row6 input,.row6 select{padding:8px 6px;font-size:13px}
.srch{margin-top:10px}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.on{opacity:1}
.pg{position:relative;background:#fff;margin:0 auto 10px;box-shadow:0 2px 12px #0003;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#0f172a}.pg.grid{background-image:linear-gradient(#0000 4.7mm,#e2e8f0 4.7mm),linear-gradient(90deg,#0000 4.7mm,#e2e8f0 4.7mm);background-size:5mm 5mm}
.el{position:absolute;white-space:pre-line;overflow:hidden;padding:.5mm;line-height:1.25}.el.sel{outline:.6mm solid #4f46e5}#edc .el{touch-action:none;cursor:move}.pn{position:absolute;bottom:4mm;right:8mm;font-size:7pt;color:#64748b}.pr{display:none}@media print{.pr{display:block;margin-bottom:8px;font-size:12px}}.rh{position:absolute;right:0;bottom:0;width:4mm;height:4mm;background:#4f46e5;opacity:.85;touch-action:none;cursor:nwse-resize}.rw .pg{margin:0}.sm{padding:8px 10px!important;flex:none!important}
@media print{header,.noprint,.toast{display:none!important}body{background:#fff;padding:0}main{padding:0;max-width:none}#pv{zoom:1!important}.pg{margin:0;box-shadow:none;page-break-after:always}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700&family=Poppins:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head><body>
<header><span class="st">✦</span><b id="ht" onclick="go('home')" style="cursor:pointer">H4 ERP</b><button class="hb" onclick="go('home');setTimeout(()=>{const x=$('gsi');x&&x.focus()},60)">🔍</button><button class="hb" id="hn" onclick="go('notif')">🔔</button><button class="hb g" onclick="quickQuote()">+ Quote</button></header>
<main id="app"></main><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),fmt=v=>'₹'+(+v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\.00$/,'');
const ST={Kerala:'32','Tamil Nadu':'33',Karnataka:'29',Maharashtra:'27','Andhra Pradesh':'37',Telangana:'36',Gujarat:'24','Delhi':'07'},UN=['kg','g','tonne','L','ml','pcs','bag','barrel','drum','box','hour','batch','sq.ft','sq.m','nos'];
Object.assign(ST,{'Andhra Pradesh':'37','Arunachal Pradesh':'12',Assam:'18',Bihar:'10',Chhattisgarh:'22',Goa:'30',Haryana:'06','Himachal Pradesh':'02','Jammu & Kashmir':'01',Jharkhand:'20','Madhya Pradesh':'23',Manipur:'14',Meghalaya:'17',Mizoram:'15',Nagaland:'13',Odisha:'21',Punjab:'03',Rajasthan:'08',Sikkim:'11',Tripura:'16','Uttar Pradesh':'09',Uttarakhand:'05','West Bengal':'19',Puducherry:'34',Chandigarh:'04',Ladakh:'38','Andaman & Nicobar':'35',Lakshadweep:'31','Dadra & Nagar Haveli and Daman & Diu':'26'});let D={company:{},customers:[],suppliers:[],rms:[],products:[],payments:[],expenses:[],costs:[],formulas:[],batches:[],invoices:[],seq:{}};
let SAVEERR=0,LOADERR=0;
try{const s=localStorage.getItem('h4erp');if(s){const o=JSON.parse(s);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;D=Object.assign(D,o)}}catch(e){LOADERR=1;try{const raw=localStorage.getItem('h4erp');if(raw&&!localStorage.getItem('h4erp_corrupt'))localStorage.setItem('h4erp_corrupt',raw)}catch(x){}}
const save=()=>{if(LOADERR)return;try{localStorage.setItem('h4erp',JSON.stringify(D));if(SAVEERR){SAVEERR=0;banner('')}}catch(e){if(!SAVEERR){SAVEERR=1;banner('⚠ Browser storage is full — your latest changes are NOT being saved. Open Backup, take a backup now, then remove large images or old records.','Open Backup',"go('bk')")}}};
const SEQC={CUS:'customers',PRD:'products',SUP:'suppliers',RM:'rms',EXP:'expenses',PAY:'payments',COST:'costs',FM:'formulas',BATCH:'batches',INV:'invoices',PUR:'purchases',QT:'quotes'};
const nxt=(p,k)=>{let mx=D.seq[k]||0;(D[SEQC[p]]||[]).forEach(x=>{const m=String((x&&x.id)||'').match(new RegExp('^'+p+'-(\\d+)'));if(m)mx=Math.max(mx,+m[1])});D.seq[k]=mx+1;return p+'-'+String(mx+1).padStart(4,'0')};
const today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
const go=r=>{const p=r.split('/');if(p[p.length-1]==='new'&&!can(RMAP[p[0]],'add')){toast('No permission to add');return}location.hash='/'+r},back=()=>history.length>1?history.back():go('home');
// ---------- generic simple modules ----------
const O=a=>a.map(x=>[x,x]);
const M={
cus:{t:'Customers',k:'customers',p:'CUS',f:[['name','Customer name *'],['mobile','Mobile *','tel'],['email','Email'],['state','State','sel',Object.keys(ST)],['gstin','GSTIN'],['address','Address','ta']],ti:'name',su:r=>r.mobile+' · '+(r.state||'')},
sup:{t:'Suppliers',k:'suppliers',p:'SUP',f:[['name','Supplier name *'],['mobile','Mobile','tel'],['location','Location'],['state','State','sel',Object.keys(ST)],['gstin','GSTIN']],ti:'name',su:r=>r.location||r.mobile},
rm:{t:'Raw Materials',k:'rms',p:'RM',f:[['name','Material name *'],['unit','Unit','sel',UN]],ti:'name',su:r=>r.unit+' · '+(curCost(r.name)?fmt(curCost(r.name).cpu)+'/'+r.unit:'no approved cost')},
prd:{t:'Products',k:'products',p:'PRD',f:[['name','Product name *'],['unit','Unit','sel',UN],['rate','Selling rate (₹)','num']],ti:'name',su:r=>fmt(r.rate)+'/'+r.unit},
exp:{t:'Expenses',k:'expenses',p:'EXP',f:[['date','Date','date'],['name','Category *  (Power, Rent, Wages…)'],['amount','Amount *','num'],['notes','Notes']],ti:'name',su:r=>r.date,am:r=>fmt(r.amount)},
pay:{t:'Payments',k:'payments',p:'PAY',f:[['dir','Direction','sel',['Received','Paid']],['date','Date','date'],['name','Name *'],['item','Purchase / Item name'],['acct','Account No. (optional)'],['party','Party','sel',['Customer','Supplier','Other']],['mode','Mode','sel',['UPI','Bank','Cash','Cheque','Card','Other']],['amount','Amount *','num'],['ref','Reference No.'],['against','Against','sel',['None','Invoice','Purchase','Advance']],['link','Invoice / Purchase no. (if against)'],['notes','Notes']],ti:'name',su:r=>r.dir+' · '+r.mode+' · '+r.date+(r.link?' · '+r.link:'')+(r.acct?' · ••••'+String(r.acct).slice(-4):''),am:r=>(r.dir==='Received'?'+':'−')+fmt(r.amount),cancel:1}
};
function curCost(n){return D.costs.find(c=>c.rm===n&&c.status==='Approved')}
function fld(f,v){const[k,l,t,o]=f,id='f_'+k;v=v??'';
 if(t==='sel')return `<label>${l}</label><select id="${id}">${(o).map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
 if(t==='ta')return `<label>${l}</label><textarea id="${id}" rows="2">${esc(v)}</textarea>`;
 return `<label>${l}</label><input id="${id}" type="${t==='num'?'number':t||'text'}" ${t==='num'?'step="any" inputmode="decimal"':''} value="${esc(v)}">`}
function list(m,q=''){const c=M[m],a=[...D[c.k]].reverse().filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
 return `<h2>${c.t.toUpperCase()}</h2>`+(m==='pay'?paySum()+`<div class="acts" style="margin:8px 0 0"><button class="btn s sm" onclick="go('exp')">💸 Expenses (power, rent, wages)</button></div>`:'')+`<input class="srch" placeholder="🔍 Search" value="${esc(q)}" oninput="$('lst').innerHTML=rows('${m}',this.value)"><div id="lst">${rows(m,q)}</div>
 <div class="acts"><button class="btn s" onclick="back()">← Back</button><button class="btn" onclick="go('${m}/new')">＋ Add</button></div>`}
function rows(m,q){const c=M[m],a=[...D[c.k]].reverse().filter(r=>(m!=='pay'||!PT||r.dir===PT)&&JSON.stringify(r).toLowerCase().includes((q||'').toLowerCase()));
 return a.map(r=>`<div class="card li" onclick="go('${m}/${r.id}')"><div><b>${esc(r[c.ti])}</b><small>${esc(r.id)} · ${esc(c.su(r))}</small></div><div class="r">${c.am?`<b>${c.am(r)}</b>`:''}${r.status==='Cancelled'?'<span class="chip bad">Cancelled</span>':r.archived?'<span class="chip">Archived</span>':''}</div></div>`).join('')||empty(m+'/new')}
function form(m,id){const c=M[m],r=c.single?D.company:(D[c.k].find(x=>x.id===id)||{date:today(),...(m==='pay'&&PRE?(()=>{const x=PRE;PRE=null;return x})():{})});
 return `<h2>${c.t.toUpperCase()}</h2><div class="card">${(()=>{const L=m==='pay'&&r.id,fl=f=>fld(f,r[f[0]]??(f[0]==='date'?today():''));return L?`<p class="mut" style="font-size:12px;margin:0">🔒 A saved payment cannot be changed. If something is wrong, cancel it with a reason and enter a new payment. Only the note can be edited.</p><fieldset disabled style="border:0;padding:0;margin:0">${c.f.filter(f=>f[0]!=='notes').map(fl).join('')}</fieldset>${fl(c.f.find(f=>f[0]==='notes'))}`:c.f.map(fl).join('')})()}<div class="acts"><button class="btn s" onclick="back()">← Back</button><button class="btn g" onclick="sv('${m}','${id||''}')">💾 Save</button>${m==='pay'&&r.id?`<button class="btn s" onclick="go('rdoc/${r.id}')">🧾 Receipt</button>`:''}
 ${r.id&&!c.single?(c.cancel?(r.status==='Cancelled'?'':`<button class="btn d" onclick="cn('${m}','${r.id}')">Cancel entry</button>`):`<button class="btn d" onclick="ar('${m}','${r.id}')">Archive</button>`):''}</div></div>
 `}
function sv(m,id){if(m==='pay'&&id){const rc=D.payments.find(x=>x.id===id);if(rc){if(rc.status==='Cancelled')return toast('A cancelled payment cannot be changed');const nt=($('f_notes')||{value:''}).value.trim();if(nt!==(rc.notes||'')){(rc.hist=rc.hist||[]).push({at:new Date().toLocaleString(),u:(typeof CU!=='undefined'&&CU&&CU.name)||'System',was:{notes:rc.notes||''}});rc.notes=nt;saud('Payment note edited',id)}save();toast('Note saved');QD=0;back();return}}const c=M[m],o={};for(const f of c.f)o[f[0]]=$('f_'+f[0]).value.trim();
 const req=c.f.find(f=>f[1].includes('*')&&!o[f[0]]);if(req)return toast('Fill: '+req[1].replace('*',''));for(const f of c.f)if(f[2]==='num'&&o[f[0]]!=='')o[f[0]]=+o[f[0]]||0;
 if(o.amount!==undefined&&!(+o.amount>0))return toast('Enter valid amount');
 if(o.gstin&&o.state&&o.gstin.slice(0,2)!==ST[o.state])return toast('GSTIN must start with '+ST[o.state]);
 if(m==='pay'){if(['Invoice','Purchase'].includes(o.against)){const inv=o.against==='Invoice',doc=(inv?D.invoices:D.purchases).find(v=>v.id===(o.link||'').toUpperCase());if(!doc||['Draft','Cancelled'].includes(doc.status))return toast(o.against+' number not found or not confirmed');let bal=inv?invS(doc).bal:purT(doc).gt-purPaid(doc);const ex=id?D.payments.find(x=>x.id===id):null;if(ex&&ex.link===doc.id&&ex.status!=='Cancelled')bal+=ex.amount;if(+o.amount>bal+.5&&!confirm('Amount is more than the balance '+fmt(bal)+'. Save anyway?'))return;o.link=doc.id;if(!o.item)o.item=doc.id}else o.link=''}
 if(c.single){Object.assign(D.company,o);o.state&&(D.company.stateCode=ST[o.state])}
 else if(id){const rc=D[c.k].find(x=>x.id===id);if(m==='pay'){(rc.hist=rc.hist||[]).push({at:new Date().toLocaleString(),u:(typeof CU!=='undefined'&&CU&&CU.name)||'System',was:{date:rc.date,name:rc.name,amount:rc.amount,mode:rc.mode,link:rc.link||''}})}Object.assign(rc,o)}else{const nr=Object.assign({id:nxt(c.p,m),status:'Active'},o);if(m==='pay'){nr.cs={...D.company};nr.tpl=cl(curTpl('receipt'))}D[c.k].push(nr)}
 save();toast('Saved');QD=0;c.single?render():back()}
function ar(m,id){if(!confirm('Archive this record? History is kept.'))return;D[M[m].k].find(x=>x.id===id).archived=1;save();back()}
function cn(m,id){const r=prompt('Cancel reason (e.g. Wrong amount, Duplicate):');if(!r)return;const x=D[M[m].k].find(x=>x.id===id);x.status='Cancelled';x.reason=r;save();back()}
// ---------- Purchases = Raw Material Landed Cost ----------
function costView(id){const c=D.costs.find(x=>x.id===id)||{date:today(),status:'Draft',charges:0};
 const opt=a=>a.map(x=>`<option ${x==c[a._k]?'selected':''}>${esc(x.name||x)}</option>`).join('');
 return `<h2>PURCHASE · LANDED COST</h2><div class="card">
 <label>Raw material</label><select id="c_rm">${D.rms.map(x=>`<option ${x.name==c.rm?'selected':''}>${esc(x.name)}</option>`).join('')||'<option value="">Add raw material first</option>'}</select>
 <label>Supplier</label><select id="c_sup"><option value="">—</option>${D.suppliers.map(x=>`<option ${x.name==c.sup?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <div class="two"><div><label>Quantity</label><input id="c_q" type="number" step="any" value="${c.q||''}" oninput="cc()"></div><div><label>Unit</label><select id="c_u">${UN.map(u=>`<option ${u==c.u?'selected':''}>${u}</option>`).join('')}</select></div></div>
 <div class="two"><div><label>Purchase rate</label><input id="c_r" type="number" step="any" value="${c.r||''}" oninput="cc()"></div><div><label>Freight</label><input id="c_f" type="number" step="any" value="${c.f||''}" oninput="cc()"></div></div>
 <div class="two"><div><label>Other charges</label><input id="c_o" type="number" step="any" value="${c.o||''}" oninput="cc()"></div><div><label>Date</label><input id="c_d" type="date" value="${c.date}"></div></div></div>
 <div class="sum" id="c_sum"></div>
 <div class="acts"><button class="btn s" onclick="back()">← Back</button>${c.status==='Approved'?'':`<button class="btn" onclick="cs('${id||''}','Draft')">Save draft</button><button class="btn g" onclick="cs('${id||''}','Approved')">Approve</button>`}</div>`}
function cv(){const q=+$('c_q').value||0,r=+$('c_r').value||0,f=+$('c_f').value||0,o=+$('c_o').value||0,m=q*r,l=m+f+o;return{m,l,cpu:q?l/q:0}}
function cc(){const v=cv();$('c_sum').innerHTML=`<div><span>Material cost</span><b>${fmt(v.m)}</b></div><div><span>Freight + other</span><b>${fmt(l2())}</b></div><div class="big"><span>Landed cost</span><span>${fmt(v.l)}</span></div><div><span>Cost / ${$('c_u').value}</span><b>${fmt(v.cpu)}</b></div>`}
const l2=()=>(+$('c_f').value||0)+(+$('c_o').value||0);
function cs(id,status){const v=cv(),o={rm:$('c_rm').value,sup:$('c_sup').value,q:+$('c_q').value,u:$('c_u').value,r:+$('c_r').value,f:+$('c_f').value||0,o:+$('c_o').value||0,date:$('c_d').value,status,...v};
 if(!o.rm||!(o.q>0)||!(o.r>0))return toast('Material, quantity and rate are required');
 if(status==='Approved')D.costs.filter(c=>c.rm===o.rm&&c.status==='Approved').forEach(c=>c.status='Archived');
 const e=D.costs.find(x=>x.id===id);e?Object.assign(e,o):D.costs.push({id:nxt('COST','cost'),...o});save();toast(status);QD=0;back()}
function costList(){const cur=D.rms.map(r=>({r,c:curCost(r.name)}));
 return `<h2>LANDED COST</h2><div class="card"><b>Current approved cost</b>${cur.map(({r,c})=>`<div class="li" style="margin-top:6px"><small>${esc(r.name)}</small>${c?`<b>${fmt(c.cpu)}/${c.u}</b>`:'<small style="color:#e11d48">no approved cost</small>'}</div>`).join('')||'<span class="mut">No raw materials yet — add them under Raw materials.</span>'}<p class="mut" style="font-size:12px;margin:8px 0 0">Only an Approved current cost is used by Quotation, Formula and Production. Draft and archived costs are never used.</p></div>
 <div class="acts"><button class="btn" onclick="go('cost/new')">＋ Add cost</button><button class="btn s" onclick="go('rm')">🧱 Raw materials</button><button class="btn s" onclick="go('pur')">🛒 Purchases</button></div><h2>COST RECORDS</h2>`+([...D.costs].reverse().map(c=>`<div class="card li" onclick="go('cost/${c.id}')"><div><b>${esc(c.rm)}</b><small>${c.date} · ${c.q} ${c.u} · ${esc(c.sup||'')}${c.pur?' · '+c.pur:''}</small></div><div class="r"><b>${fmt(c.cpu)}/${c.u}</b><span class="chip ${c.status=='Approved'?'ok':c.status=='Draft'?'warn':''}">${c.status}</span></div></div>`).join('')||empty('cost/new'))+`<div class="acts"><button class="btn s" onclick="back()">← Back</button></div>`}
// ---------- Production: formula + batch ----------
let FI=[],BB=null,BADJ='',PH={q:'',d:'month'};D.paud=D.paud||[];

const stCard=()=>{const s=stInfo(true),w=s.pct>=80;return `<div class="card" style="${w?'border-left:4px solid #e11d48':''}"><b>Browser storage</b> <span class="chip ${w?'bad':'ok'}">${s.pct}% used</span><div style="height:8px;background:var(--line);border-radius:6px;margin:8px 0"><div style="height:8px;border-radius:6px;width:${Math.min(100,s.pct)}%;background:${w?'#e11d48':'#059669'}"></div></div><small class="mut">≈ ${Math.round(s.used/1024)} KB of ~${Math.round(s.lim/1024)} KB · images ${Math.round(s.img/1024)} KB${w?' — take a backup and remove large images':''}</small></div>`};
const ERPV='1.0',SCHEMA=2;D.bklog=D.bklog||[];let RSP=null;
const empty=r=>`<div class="card mut" style="text-align:center">No records found.<br><button class="btn sm" style="margin-top:8px" onclick="go('${r}')">＋ Add New</button></div>`;
const TILES=[['SALES & CRM',[['quo','Quotation','Estimates & Quotes','Sales','📋','#0284c7,#38bdf8'],['inv','Invoice','GST Billed Sales','Tax','🧾','#06b6d4,#22d3ee'],['cus','Customers','Directory & Balances','CRM','👥','#2563eb,#60a5fa'],['pay','Payment','Received · Paid · Expenses','Cash','💵','#059669,#34d399']]],
['MANUFACTURING & INVENTORY',[['prd','Product + Formula','Products & Mixing Formulas','Master','📦','#ea580c,#fb923c'],['pur','Purchase','Suppliers & Material Inward','Inward','🛒','#0d9488,#2dd4bf'],['prod','Production','Batch Runs & Actual Cost','Batch','🏭','#7c3aed,#a78bfa'],['cost','Landed Cost','Raw Materials & Approved Cost','Cost','🧪','#d97706,#f59e0b']]],
['REPORTS & ADMINISTRATION',[['rep','Reports','Analyse · Search · Export','Analyse','📊','#4338ca,#6366f1'],['co','Company','Logo, Bank & Stamp','Profile','🏢','#4f46e5,#3b82f6']]],
['MORE',[['dd','Designer','Document Templates','Design','🎨','#a21caf,#e879f9'],['sec','Security','Users, Roles & Locks','Access','🔐','#1e293b,#475569'],['bk','Backup','Backup & Restore','Safe','💾','#0f766e,#14b8a6']]]];
function home(){const co=D.company.brand||D.company.legal;return (co?`<div class="card"><b>${esc(co)}</b><br><small class="mut">${esc(D.company.state||'')} ${D.company.gstin?'· '+esc(D.company.gstin):''}</small></div>`:`<div class="card" onclick="go('co')" style="cursor:pointer"><b>Set up your company</b><br><small class="mut">Add your company details first. Every document uses them.</small></div>`)
 +`<input class="srch" id="gsi" placeholder="🔍 Invoice / Quotation / Customer / Mobile / GSTIN / Purchase / Payment ref / Product / Batch" oninput="$('gs').innerHTML=gsrch(this.value)"><div id="gs"></div>`
 +TILES.map(([h,t])=>{const T=t.filter(x=>{const m=RMAP[x[0]];return !m||can(m,'view')});return T.length?`<h2>${h}</h2><div class="grid">${T.map(([r,n,s,tag,ic,c])=>`<button class="tile" style="background:linear-gradient(135deg,${c})" onclick="go('${r}')"><i>${tag}</i><span class="ic">${ic}</span><b>${n}</b><small>${s}</small></button>`).join('')}</div>`:''}).join('')+`<p class="mut" style="text-align:center;font-size:12px;margin-top:20px">H4 ERP v${ERPV} · data is saved in this browser — use Backup regularly.</p>`}
function notifs(){const t=today(),L=[];
 if(can('inv','view'))D.invoices.filter(invOK).forEach(v=>{const s=invS(v);if(s.bal>.5&&v.due&&v.due<t)L.push(['⏰','Overdue invoice '+v.id+' · '+cnm(v.cid)+' · '+fmt(s.bal),'inv/'+v.id])});
 if(can('cost','view')){const n=D.costs.filter(c=>c.status==='Draft').length;if(n)L.push(['🧪',n+' landed cost record(s) waiting for approval','cost'])}
 if(can('quo','view')){D.quotes.filter(q=>q.status==='Sent'&&q.date<addD(t,-7)).forEach(q=>L.push(['📋','Quotation '+qno(q)+' was sent over 7 days ago – follow up','quo/'+q.k]));D.quotes.filter(q=>q.status==='Accepted').forEach(q=>L.push(['🔄','Accepted quotation '+qno(q)+' is not yet invoiced','qinv/'+q.k]))}
 if(can('pur','view'))D.purchases.filter(p=>p.status==='Confirmed'&&purSt(p)!=='Paid').forEach(p=>L.push(['🛒','Purchase '+p.id+' payment pending · '+fmt(Math.max(0,purT(p).gt-purPaid(p))),'pur/'+p.id]));
 if(can('prod','view')){const n=D.batches.filter(b=>b.status==='In Production').length;if(n)L.push(['🏭',n+' batch(es) in production','prod'])}
 if(can('cus','view'))D.customers.filter(c=>!c.archived&&+c.creditLimit>0&&custLedger(c).due>c.creditLimit).forEach(c=>L.push(['⚠️','Credit limit exceeded · '+c.name,'cus/'+c.id]));if(can('bk','view')){const st=stInfo();if(st.pct>=80)L.push(['💾','Browser storage is '+st.pct+'% full – take a backup and remove large images','bk'])}return L}
const notifView=()=>{const L=notifs();return `<h2>NOTIFICATIONS</h2>${L.map(([i,t,r])=>`<div class="card li" onclick="go('${r}')"><span>${i} ${esc(t)}</span><span>›</span></div>`).join('')||'<div class="card mut" style="text-align:center">You are all caught up.</div>'}<div class="acts"><button class="btn s" onclick="back()">← Back</button></div>`};
const quickQuote=()=>go('quo');
// ---- backup ----
const BCNT=['customers','suppliers','rms','products','formulas','batches','costs','purchases','quotes','invoices','payments','expenses','users','templates','assets'],CL={customers:'Customers',suppliers:'Suppliers',rms:'Raw materials',products:'Products',formulas:'Formulas',batches:'Production batches',costs:'Landed costs',purchases:'Purchases',quotes:'Quotations',invoices:'Invoices',payments:'Payments',expenses:'Expenses',users:'Users',templates:'Document templates',assets:'Assets'};
const bkCounts=x=>{const c={};BCNT.forEach(k=>c[k]=(x[k]||[]).length);return c},bkTotal=c=>Object.values(c).reduce((a,b)=>a+b,0);
const bkPack=type=>({app:'H4-ERP',schema:SCHEMA,erpVersion:ERPV,backupVersion:D.bklog.length+1,createdAt:new Date().toISOString(),type,counts:bkCounts(D),data:D});
async function bkNow(type){const pkg=bkPack(typeof type==='string'?type:'Manual'),name='h4erp-backup-'+pkg.createdAt.slice(0,10)+'_'+pkg.createdAt.slice(11,16).replace(':','')+'.json';await dl(name,JSON.stringify(pkg),'application/json');const n=new Date();D.bklog.push({at:n.toLocaleString(),d:n.toLocaleDateString(),t:n.toLocaleTimeString(),type:pkg.type,v:pkg.backupVersion,total:bkTotal(pkg.counts),erp:ERPV,name});saud('Backup created',pkg.type+' v'+pkg.backupVersion);toast('Backup created');if($('rsp'))render()}
function bkValidate(txt){let o;try{o=JSON.parse(txt)}catch(e){return{ok:0,err:'The file is corrupted or is not valid JSON.'}}
 if(!o||typeof o!=='object'||Array.isArray(o))return{ok:0,err:'Invalid structure: this is not an H4 ERP backup.'};
 let pkg;if(o.app==='H4-ERP'&&o.data&&typeof o.data==='object'){if(!(+o.schema>=1)||+o.schema>SCHEMA)return{ok:0,err:'Incompatible backup: format v'+o.schema+' is not supported by this ERP (v'+SCHEMA+').'};pkg=o}
 else if(Array.isArray(o.customers)&&Array.isArray(o.invoices))pkg={app:'H4-ERP',schema:1,erpVersion:'legacy',createdAt:null,backupVersion:null,type:'Legacy file',counts:null,data:o,legacy:1};
 else return{ok:0,err:'Invalid structure: this is not an H4 ERP backup file.'};
 const d=pkg.data;for(const k of ['customers','suppliers','rms','products','formulas','batches','costs','purchases','quotes','invoices','payments','expenses','users','roles','templates','assets']){if(d[k]!=null&&!Array.isArray(d[k]))return{ok:0,err:'Invalid structure: "'+k+'" must be a list.'}}
 if(d.company!=null&&(typeof d.company!=='object'||Array.isArray(d.company)))return{ok:0,err:'Invalid structure: company data.'};
 for(const k of ['invoices','quotes','purchases','payments','customers'])if((d[k]||[]).some(x=>!x||typeof x!=='object'||Array.isArray(x)))return{ok:0,err:'Invalid structure: a '+k+' record is damaged.'};
 if(pkg.counts){const c=bkCounts(d);for(const k in pkg.counts)if(pkg.counts[k]!==c[k])return{ok:0,err:'The backup is corrupted: the number of '+(CL[k]||k).toLowerCase()+' does not match the file header.'}}
 return{ok:1,pkg}}
function rsFile(f){if(!f)return;f.text().then(t=>{const v=bkValidate(t);RSP=v.ok?{pkg:v.pkg,name:f.name}:{err:v.err,name:f.name};if(!v.ok)toast('Backup rejected');if($('rsp'))$('rsp').innerHTML=rsPreview()}).catch(()=>{RSP={err:'The file could not be read.',name:f.name};$('rsp').innerHTML=rsPreview()})}
function rsPreview(){if(!RSP)return'';if(RSP.err)return `<div class="card" style="border-left:4px solid #e11d48"><b style="color:#e11d48">❌ Backup rejected</b><p style="margin:6px 0">${esc(RSP.err)}</p><small class="mut">${esc(RSP.name||'')}</small><div class="acts"><button class="btn s" onclick="RSP=null;$('rsp').innerHTML=''">OK</button></div></div>`;
 const p=RSP.pkg,fc=bkCounts(p.data),cc=bkCounts(D);return `<div class="card" style="border-left:4px solid #d97706"><b>Restore preview</b><p class="mut" style="font-size:12px;margin:4px 0">${esc(RSP.name)} · ERP ${esc(p.erpVersion||'?')} · format v${p.schema}${p.createdAt?' · '+new Date(p.createdAt).toLocaleString():''}${p.legacy?' · <b>legacy file (no header)</b>':''}</p>
 <table style="width:100%;font-size:13px;border-collapse:collapse"><tr><th align="left">Record</th><th align="right">In file</th><th align="right">Now</th></tr>${Object.entries(CL).map(([k,l])=>`<tr><td>${l}</td><td align="right"><b>${fc[k]}</b></td><td align="right">${cc[k]}</td></tr>`).join('')}</table>
 <p style="font-size:12px;margin:8px 0">Steps: ① current data is backed up automatically ② file validated ✓ ③ you confirm ④ data is replaced ⑤ restore is recorded in the audit.</p><div class="acts"><button class="btn s" onclick="RSP=null;$('rsp').innerHTML=''">Cancel</button><button class="btn d" onclick="rsApply()">Confirm restore</button></div></div>`}
async function rsApply(){if(!RSP||!RSP.pkg)return;const p=RSP.pkg,again=bkValidate(JSON.stringify(p));if(!again.ok){RSP={err:again.err};$('rsp').innerHTML=rsPreview();return}
 if(!confirm('Replace ALL current data with this backup?\nA backup of the current data will be saved first.'))return;await bkNow('Pre-restore');
 const nd=cl(p.data),log=D.bklog.slice();Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,nd);D.bklog=log;D.bklog.push({at:new Date().toLocaleString(),d:new Date().toLocaleDateString(),t:new Date().toLocaleTimeString(),type:'Restored',v:p.backupVersion||0,total:bkTotal(bkCounts(D)),erp:p.erpVersion});
 LOADERR=0;D.saud=D.saud||[];saud('Restore completed',(RSP.name||'')+' · '+bkTotal(bkCounts(D))+' records');save();RSP=null;toast('Restored – reloading');setTimeout(()=>location.reload(),600)}
function bkView(){const c=bkCounts(D),last=D.bklog.filter(b=>b.type!=='Restored').at(-1);return `<h2>BACKUP / RESTORE</h2><div class="grid"><div class="card" style="margin:0"><small class="mut">ERP version</small><br><b>${ERPV}</b></div><div class="card" style="margin:0"><small class="mut">Backup format</small><br><b>v${SCHEMA}</b></div><div class="card" style="margin:0"><small class="mut">Last backup</small><br><b>${last?esc(last.d||last.at)+'<br><small>'+esc(last.t||'')+'</small>':'Never'}</b></div><div class="card" style="margin:0"><small class="mut">Records now</small><br><b>${bkTotal(c)}</b></div></div>
 ${stCard()}<div class="acts"><button class="btn" onclick="bkNow()">⬇ Backup now</button><button class="btn s" onclick="$('rff').click()">⬆ Restore from file</button><input type="file" id="rff" accept=".json,application/json" hidden onchange="rsFile(this.files[0]);this.value=''"></div><div id="rsp">${rsPreview()}</div>
 <div class="card"><b>Records in this ERP</b>${Object.entries(CL).map(([k,l])=>`<div class="li" style="margin-top:4px"><small>${l}</small><b>${c[k]}</b></div>`).join('')}</div>
 <h2>BACKUP HISTORY</h2>${[...D.bklog].reverse().slice(0,12).map(b=>`<div class="card" style="padding:10px"><b>${esc(b.type)}</b> · backup v${b.v}<br><small class="mut">${esc(b.d||'')} ${esc(b.t||'')} · ${b.total} records · ERP ${esc(b.erp||'')}</small></div>`).join('')||'<div class="card mut">No backups recorded yet.</div>'}<div class="acts"><button class="btn s" onclick="back()">← Back</button></div>`}

function render(){const[r,a,b]=(location.hash.slice(2)||'home').split('/'),app=$('app');let h='';if(!(r==='dd'&&b))ED=null;try{const hn=$('hn');if(hn){const n=notifs().length;hn.textContent='🔔'+(n?' '+n:'')}}catch(e){}if(gate(r))return;
 if(r==='home')h=home();else if(r==='notif')h=notifView();else if(r==='bk')h=bkView();else if(r==='prd')h=!a?prdHome():a==='new'?prdForm(''):b==='edit'?prdForm(a):prdView(a);else if(r==='co')h=coView();else if(r==='qinv')h=a?qinvView(a):qinvList();else if(r==='cus')h=!a?custList():a==='new'?custForm(''):b==='edit'?custForm(a):custView(a);else if(M[r])h=a?form(r,a==='new'?'':a):M[r].single?form(r):list(r);
 else if(r==='cost')h=a?costView(a==='new'?'':a):costList();else if(r==='prod')h=prodHome();else if(r==='fm')h=fmView(a==='new'?'':a);else if(r==='bt')h=btView(a==='new'?'':a);
 else if(r==='inv')h=a?ivView(a==='new'?'':a):ivList();else if(r==='rep')h=a?repView(a):repHome();else if(r==='quo')h=!a?qList():b!=null?qaView(a,b):qEdit(a);else if(r==='qdoc')h=qdocView(a);else if(r==='pur')h=a?purView(a==='new'?'':a):purList('');else if(r==='pdoc')h=purDocView(a);else if(r==='sec')h=secRoute(a,b);
 else if(r==='dd')h=!a?ddHome():a==='assets'?ddAssets():a==='audit'?ddAudit():a==='settings'?ddSet():!b?ddList(a):ddEdit(a,b);else if(r==='rdoc')h=rdocView(a);else if(r==='wdoc')h=wdocView(a);else if(r==='doc')h=docView(a);else h=home();app.innerHTML=h;window.scrollTo(0,0);if(r==='dd'&&b&&ED)edDraw();if(r==='quo'&&b!=null&&QA&&$('qa'))qaDraw();
 if(r==='cost'&&a)cc();if(r==='pur'&&a)purRows();if(r==='qinv'&&a&&QC)qcU();if(r==='fm'&&a)fiR();if(r==='bt'&&a)bupd();if(r==='inv'&&a)iRows()}
migTpl();let CUR=location.hash||'#/home',RESTORING=0;
const fgrp=h=>{const[r,a,b]=String(h).replace(/^#\/?/,'').split('/');if(['quo','inv','pur'].includes(r)&&a)return r+'/'+a;if(['cus','prd'].includes(r)&&(a==='new'||b==='edit'))return r+'/'+a;if(['fm','bt','pay','cost','rm','sup','exp'].includes(r)&&a)return r+'/'+a;return ''};
addEventListener('hashchange',()=>{const nh=location.hash||'#/home';if(RESTORING){RESTORING=0;CUR=nh;render();return}
 if(nh!==CUR&&QD&&!CRET&&fgrp(CUR)&&fgrp(CUR)!==fgrp(nh)){if(!confirm('Unsaved changes detected.\n\nLeave without saving?')){RESTORING=1;location.hash=CUR;return}QD=0}
 if(fgrp(CUR)!==fgrp(nh))QD=0;CUR=nh;render()});if(LOADERR)corruptBanner();render();
</script></body></html>
